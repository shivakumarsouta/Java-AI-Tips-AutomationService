<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Daily AI-generated Java interview tips — an automated archive for developers.">
    <title>Daily Java Interview Tips — Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f0f1a;
            color: #e2e8f0;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .card {
            max-width: 480px;
        }
        .badge {
            display: inline-block;
            background: rgba(129,140,248,0.15);
            border: 1px solid rgba(129,140,248,0.3);
            color: #818cf8;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 100px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #fff;
            margin-bottom: 16px;
        }
        h1 span {
            background: linear-gradient(90deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 12px;
        }
        .clock {
            font-size: 48px;
            margin: 20px 0;
        }
        footer {
            margin-top: 32px;
            font-size: 12px;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">Coming Soon</div>
        <h1>Java Interview <span>Tips Archive</span></h1>
        <div class="clock">☕</div>
        <p>This page will automatically update every morning at <strong style="color:#e2e8f0">10:00 AM IST</strong> with a new AI-generated Java interview tip.</p>
        <p>The first tip will appear here after the next scheduled run on GitHub Actions.</p>
        <footer>
            Built with Java 17 · Groq API · GitHub Actions · SQLite
        </footer>
    </div>
</body>
</html>
